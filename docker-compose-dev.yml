version: "3.9"
name: barrisense-dev

services:
  gateway-service:
    image: ghcr.io/barrisense/gateway-service:${GATEWAY_VERSION}
    container_name: gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    ports:
      - "8080:8080"
    networks:
      - barrisense-net
    expose:
      - "8080"


  auth-service:
    image: ghcr.io/barrisense/auth-service:${AUTH_VERSION}
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

      MYSQL_USER: barrisense_user
      MYSQL_PASSWORD: YourAppPassword123!
    networks:
      - barrisense-net
    expose:
      - "8081"

  complaint-service:
    image: ghcr.io/barrisense/complaint-service:${COMPLAINT_VERSION}
    container_name: complaint-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

      MYSQL_USER: barrisense_user
      MYSQL_PASSWORD: YourAppPassword123!
    networks:
      - barrisense-net
    expose:
      - "8082"
    depends_on:
      mysql-db:
        condition: service_healthy



  user-service:
    image: ghcr.io/barrisense/user-service:${USER_VERSION}
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    networks:
      - barrisense-net
    expose:
      - "8083"

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    hostname: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: YourRootPassword123!

      MYSQL_DATABASE: complaints_db

      MYSQL_USER: barrisense_user
      MYSQL_PASSWORD: YourAppPassword123!
    ports:
      - "3307:3306"
    networks:
      - barrisense-net
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYourRootPassword123!" ]
      interval: 10s
      timeout: 5s
      retries: 5



networks:
  barrisense-net:
    external: true

volumes:
  mysql-data:
