server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewriteResponseHeader=Set-Cookie, Domain=localhost, Domain=localhost
        - id: feedback-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/complaints/**
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/users/**
      default-filters:
        - RemoveResponseHeader=Server
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

  webflux:
    base-path: /

logging:
  level:
    org.springframework.cloud.gateway: INFO

jwt:
  # Dev secret (HS256/HS512-friendly)
  secret: dev-jwp-secret-key-1234567890abcdef1234567890abcdef
