server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - RewriteResponseHeader=Set-Cookie, Domain=localhost, Domain=localhost
            - RewritePath=/api/auth/v3/api-docs, /v3/api-docs
            - RewritePath=/api/auth/h2-console, /h2-console

        - id: complaint-service
          uri: http://complaint-service:8082
          predicates:
            - Path=/api/complaints/**
          filters:
            - RewritePath=/api/complaints/v3/api-docs, /v3/api-docs
            - RewritePath=/api/complaints/h2-console, /h2-console

        - id: user-service
          uri: http://user-service:8083
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/v3/api-docs, /v3/api-docs
            - RewritePath=/api/users/h2-console, /h2-console

      default-filters:
        - RemoveResponseHeader=Server
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

  webflux:
    base-path: /

logging:
  level:
    org.springframework.cloud.gateway: INFO

jwt:
  # Docker-friendly secret (same as dev, but overrideable by env var)
  secret: ${JWT_SECRET:dev-jwp-secret-key-1234567890abcdef1234567890abcdef}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    use-root-path: true
    urls:
      - name: Gateway Service
        url: /v3/api-docs
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Complaint Service
        url: /api/complaints/v3/api-docs
      - name: User Service
        url: /api/users/v3/api-docs
