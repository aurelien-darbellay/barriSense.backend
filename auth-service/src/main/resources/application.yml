spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

jwt:
  # Dev secret (HS256/HS512-friendly)
  secret: dev-jwp-secret-key-1234567890abcdef1234567890abcdef
  expiration-seconds: 3600
  refresh-expiration-seconds: 604800

# For cookies in dev, SameSite=Lax is OK if same-origin; adjust if using a separate front-end origin.
security:
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    org.springframework.security: INFO
