spring:
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
  profiles:
    active: dev

server:
  port: 8083
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.barrisense.backend.user: DEBUG


