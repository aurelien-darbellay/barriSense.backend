spring:
  # Desactivamos los scripts SQL (si los hubiera)
  sql:
    init:
      mode: never

  jpa:
    hibernate:
      # 'update' creará las tablas de User automáticamente
      ddl-auto: update
    defer-database-initialization: true

  datasource:

    url: jdbc:mysql://mysql-db:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true


    driver-class-name: com.mysql.cj.jdbc.Driver


    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

    hikari:
      
      initialization-fail-timeout: 60000