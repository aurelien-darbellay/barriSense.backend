server:
  port: 8082

spring:
  application:
    name: barrisense-feedback-api

  # --- CONFIGURACIÓN PARA EL IDE (LOCAL) ---
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ❗️ APUNTA A LOCALHOST:3307 (Workbench)
    url: jdbc:mysql://localhost:3307/complaints_db?useSSL=false&allowPublicKeyRetrieval=true
    # ❗️ PON LAS CREDENCIALES DIRECTAMENTE
    username: barrisense_user
    password: YourAppPassword123! # (O la que pusiste en mysql-compose.yml)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # dialect: org.hibernate.dialect.MySQLDialect # (Este ya no es necesario)

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.barriSenseBack.barrisense_feedback_api: DEBUG
    org.hibernate.SQL: DEBUG