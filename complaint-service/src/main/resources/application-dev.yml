spring:

  datasource:

    url: jdbc:mysql://mysql-db:3306/complaints_db?useSSL=false&allowPublicKeyRetrieval=true

    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

    hikari:
      # Tiempo (en ms) que esperará a que la BBDD esté disponible al arrancar

      initialization-fail-timeout: 60000